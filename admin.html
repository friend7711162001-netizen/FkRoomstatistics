<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>集團間數核對表 - 管理員後台</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest_admin.json">
    <link rel="apple-touch-icon" href="icon-admin.svg">
    <link rel="icon" type="image/svg+xml" href="icon-admin.svg">
    <meta name="theme-color" content="#2c3e50">
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client?onload=onGoogleLibraryLoad" async defer></script>
</head>
<body class="admin-body">
    <div class="admin-container">
        <!-- 登入區塊 -->
        <div id="loginSection" class="login-box">
            <h1>管理員登入</h1>
            <p>請使用 Google 帳號登入以查看核對表</p>
            <div id="buttonDiv" style="display: flex; justify-content: center; margin-top: 24px;"></div>
        </div>

        <!-- 儀表板區塊 -->
        <div id="dashboardSection" class="dashboard hidden">
            <header class="dashboard-header">
                <div>
                    <h1>集團間數稽核</h1>
                    <p>管理員：<span id="adminName"></span></p>
                </div>
                <button id="logoutBtn" class="btn-secondary">登出</button>
            </header>

            <!-- 分頁切換按鈕 -->
            <div class="tab-container" style="margin-top: 20px;">
                <button class="tab-btn active" data-tab="audit">數據稽核</button>
                <button class="tab-btn" data-tab="history">歷史調閱 (館別分組)</button>
            </div>

            <!-- 數據稽核分頁內容 -->
            <div id="auditTab" class="tab-content active">
                <!-- 匯入系統間數區塊 -->
                <div class="import-section" style="margin-bottom: 24px; padding-bottom: 24px; border-bottom: 2px dashed var(--border-color);">
                    <div class="controls" style="margin-bottom: 16px; margin-top: 20px; display: flex; align-items: flex-end; gap: 10px;">
                        <div class="form-group" style="margin-bottom: 0;">
                            <label for="importDate">選擇匯入日期：</label>
                            <input type="date" id="importDate" style="width: 200px;">
                        </div>
                        <button id="importSysBtn" class="btn-secondary" style="padding: 10px 20px; flex-shrink: 0;">匯入</button>
                    </div>

                    <div class="expected-totals" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; background: var(--bg-color); padding: 16px; border-radius: 12px; border: 1px solid var(--border-color);">
                        <div style="font-weight: 600; grid-column: 1 / -1; color: var(--primary-color);">填寫系統總間數</div>
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <label style="margin: 0; min-width: 40px; font-size: 0.95rem;">雅霖:</label>
                            <input type="number" id="expect-雅霖" min="0" placeholder="間" style="padding: 8px;" autocomplete="off">
                        </div>
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <label style="margin: 0; min-width: 40px; font-size: 0.95rem;">豐家:</label>
                            <input type="number" id="expect-豐家" min="0" placeholder="間" style="padding: 8px;" autocomplete="off">
                        </div>
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <label style="margin: 0; min-width: 40px; font-size: 0.95rem;">豐國:</label>
                            <input type="number" id="expect-豐國" min="0" placeholder="間" style="padding: 8px;" autocomplete="off">
                        </div>
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <label style="margin: 0; min-width: 40px; font-size: 0.95rem;">豐谷:</label>
                            <input type="number" id="expect-豐谷" min="0" placeholder="間" style="padding: 8px;" autocomplete="off">
                        </div>
                    </div>
                </div>

                <!-- 稽核查詢區塊 -->
                <div class="audit-section">
                    <div class="controls" style="margin-bottom: 24px; display: flex; align-items: flex-end; gap: 10px;">
                        <div class="form-group" style="margin-bottom: 0;">
                            <label for="filterDate">選擇稽核日期：</label>
                            <input type="date" id="filterDate" style="width: 200px;">
                        </div>
                        <button id="fetchDataBtn" style="flex: 1; padding: 10px 20px;">開始稽核查詢</button>
                    </div>

                    <div id="resultsContainer" class="results-grid">
                        <!-- 稽核卡片將由 JS 動態產生 -->
                    </div>
                </div>
            </div>

            <!-- 歷史調閱分頁內容 -->
            <div id="historyTab" class="tab-content">
                <div class="controls" style="margin-bottom: 24px; margin-top: 20px;">
                    <div class="form-group" style="flex: 1; margin-bottom: 0;">
                        <label for="historyDate">選擇調閱日期：</label>
                        <input type="date" id="historyDate">
                    </div>
                    <button id="fetchHistoryBtn" style="margin-top: 10px; width: 100%;">讀取歷史紀錄</button>
                </div>

                <div id="historyContainer">
                    <div class="no-data">請選擇日期並點擊按鈕讀取</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 詳細資訊彈窗 -->
    <div id="detailsModal" class="modal hidden">
        <div class="modal-content" style="max-width: 600px; width: 95%; padding: 24px;">
            <h2 id="detailsModalTitle" style="margin-bottom: 20px; color: var(--primary-color);"></h2>
            <div id="detailsModalBody" style="text-align: left; max-height: 60vh; overflow-y: auto;">
            </div>
            <button id="closeDetailsBtn" class="btn-secondary" style="margin-top: 20px;">關閉</button>
        </div>
    </div>

    <!-- 載入中遮罩 -->
    <div id="adminLoadingOverlay" class="loading-overlay hidden">
        <div class="spinner"></div>
        <p>資料讀取中...</p>
    </div>

    <script src="config.js"></script>
    <script src="admin.js"></script>
</body>
</html>
